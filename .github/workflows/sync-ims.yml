name: Sync the inventory CLI download
on:
  schedule:
    - cron: "15 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-inventory-download
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.compare.outputs.source }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: portfolio
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: josephchitalu2/INVENTORY-MANAGEMENT-SYSTEM-
          ref: main
          path: ims
          persist-credentials: false
      - id: compare
        run: |
          echo "source=$(git -C ims rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if cmp -s ims/ims.py portfolio/downloads/ims.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.compare.outputs.changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - if: steps.compare.outputs.changed == 'true'
        working-directory: ims
        run: |
          python -m pip install -r requirements.txt
          python scripts/smoke_check.py
          python -m unittest discover -s tests -v

  update:
    needs: verify
    if: needs.verify.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: portfolio
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: josephchitalu2/INVENTORY-MANAGEMENT-SYSTEM-
          ref: ${{ needs.verify.outputs.source }}
          path: ims
          persist-credentials: false
      - name: Publish the verified file when it has changed
        working-directory: portfolio
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source }}
        run: |
          latest=$(git ls-remote https://github.com/josephchitalu2/INVENTORY-MANAGEMENT-SYSTEM-.git refs/heads/main | cut -f1)
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "The inventory repository moved. Re-run to check its new main."
            exit 1
          fi
          cp ../ims/ims.py downloads/ims.py
          git add -- downloads/ims.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync inventory CLI from ${SOURCE_SHA:0:12}"
          git push origin HEAD:main
